services:
  - type: web
    name: eganna-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EGANNA_MODE
        value: live
      - key: EGANNA_CACHE_TTL
        value: "1200"
      - key: NTFY_TOPIC
        sync: false
      - key: CRON_SECRET
        generateValue: true
